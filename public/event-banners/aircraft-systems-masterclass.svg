<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Aircraft Systems and Safety Masterclass</title>
  <desc id="desc">A Kenya Airways themed aviation banner with an aircraft silhouette and flight path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071626"/><stop offset="1" stop-color="#173d5a"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8102e" stop-opacity=".88"/><stop offset="1" stop-color="#e9a93b" stop-opacity=".7"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d5e4fa" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1280" height="480" rx="28" fill="url(#bg)"/>
